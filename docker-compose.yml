services:
  # tg-archive: синхронизация Telegram-чата в SQLite
  # Запуск: docker compose run --rm tg-archive --new (первый раз, интерактивно)
  #         docker compose run --rm tg-archive --sync (синхронизация)
  tg-archive:
    build:
      context: ./tg-archive
    image: watchdog-tg-archive:latest
    volumes:
      - telegram_data:/data
    environment:
      - TG_API_ID=${TG_API_ID}
      - TG_API_HASH=${TG_API_HASH}
      - TG_PHONE=${TG_PHONE}
      - TG_CHAT_IDS=${TG_CHAT_IDS}
    # Не запускается автоматически — только по запросу
    profiles:
      - sync

  # watchdog-mcp: MCP-сервер для чтения данных (stdio transport)
  # НЕ запускается в фоне — stdio-сервер живёт пока подключён клиент.
  # MCP-клиент сам спавнит его через:
  #   docker run -i --rm -v telegram_data:/data -e WATCHDOG_DB_PATH=/data/data.sqlite watchdog-mcp:latest
  watchdog-mcp:
    build:
      context: ./watchdog-mcp
    image: watchdog-mcp:latest
    volumes:
      - telegram_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHDOG_DB_PATH=/data/data.sqlite
    profiles:
      - mcp
    networks:
      - default

volumes:
  telegram_data:
    name: telegram_data

networks:
  default:
    name: watchdog_default

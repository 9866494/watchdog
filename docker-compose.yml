services:
  # tg-archive: синхронизация Telegram-чата в SQLite
  # Запуск: docker compose run --rm tg-archive --new (первый раз, интерактивно)
  #         docker compose run --rm tg-archive --sync (синхронизация)
  tg-archive:
    build:
      context: ./tg-archive
    image: watchdog-tg-archive:latest
    volumes:
      - telegram_data:/data
    environment:
      - TG_API_ID=${TG_API_ID}
      - TG_API_HASH=${TG_API_HASH}
      - TG_PHONE=${TG_PHONE}
      - TG_CHAT_IDS=${TG_CHAT_IDS}
    # Не запускается автоматически — только по запросу
    profiles:
      - sync

  # watchdog-mcp: постоянный MCP-сервис со Streamable HTTP
  # Клиенты подключаются к http://127.0.0.1:8040/mcp
  watchdog-mcp:
    build:
      context: ./watchdog-mcp
    image: watchdog-mcp:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8040:8040"
    volumes:
      - telegram_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHDOG_DB_PATH=/data/data.sqlite
      - WATCHDOG_HOST=0.0.0.0
      - WATCHDOG_PORT=8040
    networks:
      - default

volumes:
  telegram_data:
    name: telegram_data

networks:
  default:
    name: watchdog_default

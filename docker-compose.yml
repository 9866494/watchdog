services:
  # tg-archive: синхронизация Telegram-чата в SQLite
  # Запуск: docker compose run --rm tg-archive --new (первый раз, интерактивно)
  #         docker compose run --rm tg-archive --sync (синхронизация)
  tg-archive:
    build:
      context: ./tg-archive
    volumes:
      - telegram_data:/data
    environment:
      - TG_API_ID=${TG_API_ID}
      - TG_API_HASH=${TG_API_HASH}
      - TG_PHONE=${TG_PHONE}
      - TG_CHAT_IDS=${TG_CHAT_IDS}
    # Не запускается автоматически — только по запросу
    profiles:
      - sync

  # watchdog-mcp: MCP-сервер для чтения данных
  # Запуск: docker compose up -d watchdog-mcp
  watchdog-mcp:
    build:
      context: ./watchdog-mcp
    volumes:
      - telegram_data:/data
    environment:
      - WATCHDOG_DB_PATH=/data/data.sqlite
    restart: unless-stopped
    # Сеть для доступа от Claude Desktop
    networks:
      - default

volumes:
  telegram_data:
    name: telegram_data

networks:
  default:
    name: watchdog_default
